# Extra collections shown only on /admin/full/ (Sightwise safety view). Appended to config.yml by build.py.
  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    description: "Reviews and kind words from candidates and schools. They appear on the Testimonials page, and the newest two on the homepage."
    folder: content/testimonials
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{fields.name}}-{{year}}{{month}}{{day}}"
    identifier_field: name
    summary: "{{name}}: {{quote}}"
    sortable_fields: ["date", "name"]
    fields:
      - { label: "Show on website", name: show, widget: boolean, default: true }
      - { label: "Name", name: name, widget: string, hint: "As the person is happy to be named, for example: Sarah J." }
      - { label: "Who they are", name: who, widget: string, required: false, hint: "Optional, for example: Teaching assistant, or Headteacher, primary school in Basildon" }
      - { label: "What they said", name: quote, widget: text }
      - { label: "Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, picker_utc: true }
      - { label: "Where it came from", name: source, widget: select, default: "Email", options: ["Facebook", "Google", "Email", "In person", "Other"] }
